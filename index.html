<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Centered quick-launch icons for frequently used websites."
    />
    <title>G Lander</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <!-- Quick launcher: icon-only links for frequent destinations. -->
      <nav class="quick-links" aria-label="Quick website links">

          <img src="https://raw.githubusercontent.com/immich-app/immich/refs/heads/main/design/immich-logo.svg" alt="Immich" class="icon-favicon" />

        </a>
        <a class="icon-link" href="https://dr.dk" target="_blank" rel="noopener noreferrer" aria-label="DR News" title="DR News">

        <a class="icon-link" data-no-favicon="true" href="https://nyheder.tv2.dk/" target="_blank" rel="noopener noreferrer" aria-label="TV 2 Nyheder" title="TV 2 Nyheder">
          <img src="https://coreui.tv2a.dk/favicons/white_background/apple_touch_icon.png" alt="TV 2 Nyheder" class="icon-favicon" style="object-fit:contain;width:100%;height:100%;" />
        </a>
        <a class="icon-link icon-link-lapresse" data-no-favicon="true" href="https://lapresse.ca" target="_blank" rel="noopener noreferrer" aria-label="La Presse" title="La Presse">
          <img src="https://static.lpcdn.ca/lpweb/mobile/img/la-presse-logo-web.svg" alt="La Presse" class="icon-favicon" />

        <a class="icon-link icon-link-cnn" data-no-favicon="true" href="https://cnn.com" target="_blank" rel="noopener noreferrer" aria-label="CNN" title="CNN">
          <img src="https://edition.cnn.com/media/sites/cnn/cnn.svg" alt="CNN" class="icon-favicon" />

        </a>
        <a class="icon-link icon-link-macrumors" data-no-favicon="true" href="https://macrumors.com" target="_blank" rel="noopener noreferrer" aria-label="MacRumors" title="MacRumors">

        </a>
        <a class="icon-link icon-link-nintendolife" data-no-favicon="true" href="https://nintendolife.com" target="_blank" rel="noopener noreferrer" aria-label="Nintendo Life" title="Nintendo Life">

        <a class="icon-link icon-link-youtube" data-no-favicon="true" href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
          <img src="https://cdn.simpleicons.org/youtube/ff0000" alt="YouTube" class="icon-favicon" />

        <!-- Jellyfin -->
        <a class="icon-link icon-link-jellyfin" data-no-favicon="true" href="http://100.76.192.87:8096" target="_blank" rel="noopener noreferrer" aria-label="Jellyfin" title="Jellyfin">

        </a>

        <!-- Plex -->
        <a class="icon-link" data-no-favicon="true" href="http://100.76.192.87:32400/web" target="_blank" rel="noopener noreferrer" aria-label="Plex" title="Plex">

        <a class="icon-link icon-link-threadfin" data-no-favicon="true" href="http://100.76.192.87:34400" target="_blank" rel="noopener noreferrer" aria-label="Threadfin" title="Threadfin">

        <!-- Ersatztv -->
        <a class="icon-link icon-link-ersatztv" data-no-favicon="true" href="http://100.76.192.87:8409" target="_blank" rel="noopener noreferrer" aria-label="ErsatzTV" title="ErsatzTV">
          <img src="logos/ersatztv.svg" alt="ErsatzTV" class="icon-favicon" />
        </a>
      </nav>

      <!-- DuckDuckGo search shortcut. -->
      <form class="search-bar" action="https://duckduckgo.com/" method="GET" target="_blank" autocomplete="off">
        <input id="duckduckgo-search" name="q" type="text" placeholder="Search DuckDuckGo..." aria-label="Search DuckDuckGo" autofocus required />
        <button type="submit" aria-label="Search">
          <span class="bi bi-search"></span>
        </button>
      </form>
    </main>

    <!-- Behavior: favicon loading and desktop search auto-focus. -->
    <script src="app.js" defer></script>
  </body>
</html>
