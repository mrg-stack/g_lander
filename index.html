<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Centered quick-launch icons for frequently used websites."
    />
    <title>G Lander</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <!-- Simple horizontal launcher with icon-only links. -->
      <nav class="quick-links" aria-label="Quick website links">
        <a class="icon-link icon-link-budget" data-no-favicon="true" href="https://docs.proton.me/u/1/sheet?mode=open&volumeId=lYEZIf0XVWHwk3YkPxmNYA&linkId=Y-3PbEetr2YSVXhCH70Mrw" target="_blank" rel="noopener noreferrer" aria-label="Budget" title="Budget">
          <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/proton-sheets.svg" alt="Budget" class="icon-favicon" />
        </a>
        <a class="icon-link icon-link-copilot" data-no-favicon="true" href="https://m365.cloud.microsoft/chat/" target="_blank" rel="noopener noreferrer" aria-label="Copilot" title="Copilot">
          <img src="https://upload.wikimedia.org/wikipedia/en/a/aa/Microsoft_Copilot_Icon.svg" alt="Copilot" class="icon-favicon" />
        </a>
        <a class="icon-link" href="https://dr.dk" target="_blank" rel="noopener noreferrer" aria-label="DR News" title="DR News">
          <img src="https://i.ibb.co/c6n2vbW/512px-DR-TV-logo-svg.png" alt="DR Logo" class="icon-favicon" style="object-fit:contain;width:100%;height:100%;background:#000;border-radius:50%;" />
        </a>
        <a class="icon-link" href="https://nyheder.tv2.dk/" target="_blank" rel="noopener noreferrer" aria-label="TV 2 Nyheder" title="TV 2 Nyheder">
          <span>03</span>
        </a>
        <a class="icon-link" href="https://lapresse.ca" target="_blank" rel="noopener noreferrer" aria-label="La Presse" title="La Presse">
          <span>04</span>
        </a>
        <a class="icon-link" href="https://cnn.com" target="_blank" rel="noopener noreferrer" aria-label="CNN" title="CNN">
          <span>05</span>
        </a>
        <a class="icon-link" href="https://theguardian.com" target="_blank" rel="noopener noreferrer" aria-label="The Guardian" title="The Guardian">
          <span>06</span>
        </a>
        <a class="icon-link" href="https://macrumors.com" target="_blank" rel="noopener noreferrer" aria-label="MacRumors" title="MacRumors">
          <span>07</span>
        </a>
        <a class="icon-link" href="https://nintendolife.com" target="_blank" rel="noopener noreferrer" aria-label="Nintendo Life" title="Nintendo Life">
          <span>08</span>
        </a>
        <a class="icon-link" href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
          <span>09</span>
        </a>
      </nav>
      <form class="search-bar" action="https://duckduckgo.com/" method="GET" target="_blank" autocomplete="off">
        <input id="duckduckgo-search" name="q" type="text" placeholder="Search DuckDuckGo..." aria-label="Search DuckDuckGo" autofocus required />
        <button type="submit" aria-label="Search">
          <span class="bi bi-search"></span>
        </button>
      </form>
      <script>
        // Auto-select the search bar input on page/tab open
        window.addEventListener('DOMContentLoaded', function() {
          var searchInput = document.getElementById('duckduckgo-search');
          if (searchInput) {
            searchInput.focus();
            searchInput.select();
          }
        });
      </script>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
